name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      ui_validation_mode:
        description: Full release gate or focused native account-menu diagnosis
        type: choice
        options:
          - full
          - account-menu-comparison
        default: full
      comparison_base_sha:
        description: Exact ancestor SHA for account-menu comparison only
        type: string
        default: ''

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swiftlint:
    name: SwiftLint
    runs-on: macos-26
    timeout-minutes: 10
    env:
      SWIFTLINT_EXCLUDED_GITHUB_BILLING: ${{ github.workspace }}/GitHubBillingFixtureTests

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run pinned SwiftLint policy
        run: >-
          xcrun swift package plugin
          --allow-writing-to-package-directory
          swiftlint lint
          --reporter github-actions-logging
          .

      - name: Verify CI trigger policy
        run: python3 -m unittest discover -s scripts/tests -p 'test_ci_policy.py' -v

  strict-concurrency:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: Strict concurrency
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify pinned release toolchain and installed runtimes
        run: python3 scripts/verify-release-toolchain.py --output "$RUNNER_TEMP/release-toolchain.json"

      - name: Build with complete strict concurrency checking
        run: ./scripts/check-strict-concurrency.sh

  ios-tests:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: iOS tests
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify pinned release toolchain and installed runtimes
        run: python3 scripts/verify-release-toolchain.py --output "$RUNNER_TEMP/release-toolchain.json"

      - name: Verify function risk and release phase failure fixtures
        run: python3 -m unittest scripts.tests.test_function_risk scripts.tests.test_pro_release_validation -v

      - name: Prove raw coverage line union on the pinned toolchain
        run: python3 scripts/function-risk/prove-coverage-union.py --output "$RUNNER_TEMP/coverage-union"

      - name: Run iOS unit tests
        id: ios-tests
        run: ./scripts/run-pro-release-validation.sh native --output "$RUNNER_TEMP/pro-native"

      - name: Enforce iOS function risk baseline
        id: ios-risk
        run: >-
          python3 scripts/function-risk/measure.py --platform ios
          --inputs "$RUNNER_TEMP/pro-native/coverage-inputs.json"
          --output "$RUNNER_TEMP/function-risk-ios"

      - name: Publish iOS function risk
        if: ${{ always() && (steps.ios-risk.outcome == 'success' || steps.ios-risk.outcome == 'failure') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: function-risk-ios
          path: ${{ runner.temp }}/function-risk-ios
          if-no-files-found: error
          retention-days: 14

      - name: Preserve iOS test diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CodexBarIOSTests-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pro-native
            ${{ runner.temp }}/coverage-union
            ${{ runner.temp }}/release-toolchain.json
            !${{ runner.temp }}/pro-native/DerivedData-*/**
            !${{ runner.temp }}/coverage-union/*/DerivedData/**
          if-no-files-found: warn
          retention-days: 14

  watch-tests:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: watchOS tests
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify pinned release toolchain and installed runtimes
        run: python3 scripts/verify-release-toolchain.py --output "$RUNNER_TEMP/release-toolchain.json"

      - name: Test Apple Watch simulator selection
        run: ./scripts/tests/select-watch-simulator-tests.sh

      - name: Select a compatible Apple Watch simulator
        id: watch-destination
        shell: bash
        run: |
          set -euo pipefail

          device_id="$(./scripts/select-watch-simulator.sh)"

          python3 scripts/verify-release-toolchain.py --watch-device "$device_id" --output "$RUNNER_TEMP/watch-toolchain.json"

          xcrun simctl boot "$device_id" 2>/dev/null || true
          xcrun simctl bootstatus "$device_id" -b

          echo "id=$device_id" >> "$GITHUB_OUTPUT"

      - name: Run watchOS unit tests
        id: watch-tests
        run: |
          set -o pipefail
          xcodebuild \
            -project CodexBarIOS.xcodeproj \
            -scheme CodexBarWatchTests \
            -skipPackagePluginValidation \
            -destination "platform=watchOS Simulator,id=${{ steps.watch-destination.outputs.id }}" \
            -enableCodeCoverage YES \
            -resultBundlePath "$RUNNER_TEMP/CodexBarWatchTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Enforce watchOS function risk baseline
        id: watch-risk
        run: >-
          python3 scripts/function-risk/measure.py --platform watch
          --result "$RUNNER_TEMP/CodexBarWatchTests.xcresult"
          --output "$RUNNER_TEMP/function-risk-watch"

      - name: Publish watchOS function risk
        if: ${{ always() && (steps.watch-risk.outcome == 'success' || steps.watch-risk.outcome == 'failure') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: function-risk-watch
          path: ${{ runner.temp }}/function-risk-watch
          if-no-files-found: error
          retention-days: 14

      - name: Preserve watchOS test diagnostics
        if: ${{ failure() && steps.watch-tests.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CodexBarWatchTests-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/CodexBarWatchTests.xcresult
          if-no-files-found: warn
          retention-days: 14

  smoke-tests:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: SwiftPM smoke tests
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify pinned release toolchain and installed runtimes
        run: python3 scripts/verify-release-toolchain.py --output "$RUNNER_TEMP/release-toolchain.json"

      - name: Run smoke harness
        run: xcrun swift run CodexBarIOSSmokeTests

      - name: Verify widget reset caption layout
        run: ./scripts/tests/widget-reset-layout-tests.sh

      - name: Verify perfection gate selection and failure reporting
        run: python3 -m unittest discover -s scripts/tests -p 'test_perfection_runner.py' -v

  ios-ui-families:
    name: iOS UI journeys (${{ matrix.family }})
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.ui_validation_mode != 'account-menu-comparison' && success() }}
    needs:
      - swiftlint
      - strict-concurrency
      - ios-tests
      - watch-tests
      - smoke-tests
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        family: [iphone, ipad]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify pinned release toolchain and installed runtimes
        run: python3 scripts/verify-release-toolchain.py --output "$RUNNER_TEMP/release-toolchain.json"

      - name: Create an owned UI simulator
        id: ui-device
        run: |
          ./scripts/run-pro-release-validation.sh provision --family "${{ matrix.family }}" --output "$RUNNER_TEMP/ui-device"
          echo "id=$(jq -r .device.deviceId "$RUNNER_TEMP/ui-device/ownership.json")" >> "$GITHUB_OUTPUT"

      - name: Run GitHub Billing API fixtures
        if: ${{ matrix.family == 'iphone' }}
        run: xcrun swift run GitHubBillingFixtureTests

      - name: Run UI journeys
        id: ui-base
        if: ${{ !cancelled() && steps.ui-device.outcome == 'success' }}
        env:
          UI_TEST_REQUIRE_DEVICE_ID: '1'
          UI_TEST_OWNERSHIP_RECEIPT: ${{ runner.temp }}/ui-device/ownership.json
          UI_TEST_RESULTS_DIR: ${{ runner.temp }}/ui-tests
          UI_TEST_DEVICE_ID: ${{ steps.ui-device.outputs.id }}
        run: ./scripts/run-ui-tests.sh "${{ matrix.family }}"

      - name: Run supplemental and commerce release phases
        if: ${{ !cancelled() && steps.ui-base.outcome == 'success' }}
        run: >-
          ./scripts/run-pro-release-validation.sh ui --family "${{ matrix.family }}"
          --ownership "$RUNNER_TEMP/ui-device/ownership.json"
          --base-results "$RUNNER_TEMP/ui-tests" --output "$RUNNER_TEMP/pro-ui"

      - name: Shut down the owned UI simulator
        if: ${{ always() && steps.ui-device.outcome == 'success' }}
        run: >-
          ./scripts/run-pro-release-validation.sh shutdown --family "${{ matrix.family }}"
          --ownership "$RUNNER_TEMP/ui-device/ownership.json" --output "$RUNNER_TEMP/ui-shutdown"

      - name: Preserve UI test results and failure screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CodexBarIOSUITests-${{ matrix.family }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ui-tests
            ${{ runner.temp }}/pro-ui
            ${{ runner.temp }}/ui-device
            ${{ runner.temp }}/ui-shutdown
            ${{ runner.temp }}/release-toolchain.json
            !${{ runner.temp }}/ui-tests/*/DerivedData-*/**
            !${{ runner.temp }}/pro-ui/DerivedData-*/**
          if-no-files-found: warn
          retention-days: 14

  ios-ui-tests:
    name: Full iOS UI validation
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.ui_validation_mode != 'account-menu-comparison' }}
    needs: ios-ui-families
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Require both UI destinations
        env:
          UI_FAMILIES_RESULT: ${{ needs.ios-ui-families.result }}
        run: |
          if [[ "$UI_FAMILIES_RESULT" != success ]]; then
            echo "Both UI destinations must pass. Combined result=$UI_FAMILIES_RESULT" >&2
            if [[ "$UI_FAMILIES_RESULT" == skipped ]]; then
              echo "UI workers did not run. Check the prerequisite manual quality jobs for failure or cancellation." >&2
            fi
            exit 1
          fi

  account-menu-comparison:
    name: Account menu comparison
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.ui_validation_mode == 'account-menu-comparison' && success() }}
    needs:
      - swiftlint
      - strict-concurrency
      - ios-tests
      - watch-tests
      - smoke-tests
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify pinned release toolchain and installed runtimes
        run: python3 scripts/verify-release-toolchain.py --output "$RUNNER_TEMP/release-toolchain.json"

      - name: Compare the original account journey on baseline and candidate
        env:
          ACCOUNT_MENU_BASE_SHA: ${{ inputs.comparison_base_sha }}
          UI_TEST_RESULTS_DIR: ${{ runner.temp }}/ui-tests
        run: python3 scripts/compare-account-menu.py

      - name: Preserve comparison results and failure screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AccountMenuComparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ui-tests
          if-no-files-found: warn
          retention-days: 14
